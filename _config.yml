# Site Settings
title: "SCooley IO"
masthead_title: "scooley<span class='site-domain'>.io</span>"
name: "SCooley IO"
description: "Curious, with a few loose threads. Things Sarah Cooley is making, learning, and wondering about."
url: "https://scooley.io"
baseurl: ""

# Theme Settings
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "default"

# Site Author
author:
  name: "Sarah Cooley"
  bio: "Curious human and tech enthusiast"

# Reading Files
include:
  - _pages
exclude:
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - assets/README.md
  - assets/js/README.md
  - SITE.md
  - Gemfile
  - Gemfile.lock
  - extensions
  - models
  - workflows
  - vaults
  - grants
  - skills-lock.json
  - 2026-11-02_DRIFT_REPORT.md

# Defaults
defaults:
  # _posts
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author: scooley
      author_profile: true
      read_time: true
      show_date: true
      comments: false
      share: true
      related: true
  # _pages
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

# Outputting
permalink: /blog/:categories/:title/
paginate: 5
paginate_path: /page:num/
timezone: America/New_York

# Plugins
plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

# Archives
category_archive:
  type: liquid
  path: /categories/
tag_archive:
  type: liquid
  path: /tags/
